<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Guardian</title><style>
:root{--bg:#000;--p:#010701;--b:#0b6b0b;--t:#39ff14;--m:#22b30f;--a:#39ff14;--bad:#ff4d4d;--ok:#39ff14;--w:#fff;--glow:0 0 14px rgba(57,255,20,.5),inset 0 0 8px rgba(57,255,20,.15)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 "Courier New",Courier,monospace;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);text-shadow:0 0 6px rgba(57,255,20,.35)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--b)}
h1{margin:0;font:700 22px "Courier New",monospace;color:var(--t);text-shadow:0 0 10px var(--t)}
.stat{color:var(--m);font-size:13px}.stat b{color:var(--t)}
main{display:grid;grid-template-columns:240px 1fr;gap:16px;max-width:1000px;margin:16px auto;padding:0 16px}
@media(max-width:720px){main{grid-template-columns:1fr}#lv{flex-direction:row!important;overflow-x:auto}#lv button{min-width:150px}}
#lv{display:flex;flex-direction:column;gap:8px}
#lv button{text-align:left;background:transparent;border:1px solid var(--b);color:var(--t);padding:9px 12px;cursor:pointer;font:inherit}
#lv button.cur{border:2px solid var(--a);box-shadow:var(--glow)}
#lv button:disabled{opacity:.4;cursor:not-allowed}#lv small{display:block;color:var(--m)}
.card{background:var(--p);border:2px solid var(--a);box-shadow:var(--glow);padding:18px;margin-bottom:16px}
h3{margin:0 0 10px;font:700 20px "Courier New",monospace;text-shadow:0 0 10px var(--t)}
#chat{height:min(46vh,420px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:8px;scrollbar-color:var(--t) #031403}
.m{white-space:pre-wrap;overflow-wrap:anywhere}
.m.user{color:var(--w);text-shadow:none}.m.user::before{content:"> "}.m.ai::before{content:"AI: "}.m.sys::before{content:""}.m.x{color:var(--bad);text-shadow:none}
.row{display:flex;gap:8px;align-items:center;margin-top:12px}.dl{border-top:1px dotted var(--b);padding-top:12px}.pr{color:var(--t);font-weight:700}
input{flex:1;min-width:0;background:transparent;color:var(--w);border:0;padding:8px 4px;font:inherit;caret-color:var(--t);text-shadow:none}
#pw{border-bottom:1px dotted var(--b)}input::placeholder{color:#0b6b0b}input:focus{outline:0;background:rgba(57,255,20,.07)}
button.go,button.ghost{background:transparent;color:var(--t);border:1px solid var(--t);padding:8px 14px;font:700 14px "Courier New",monospace;text-transform:uppercase;cursor:pointer}
button.ghost{border-color:var(--b);color:var(--m);font-weight:400}
button.go:hover,button.ghost:hover:not(:disabled){background:var(--t);color:#000;text-shadow:none;box-shadow:0 0 12px var(--t)}
button:disabled{opacity:.45;cursor:wait}.fb{min-height:22px;margin-top:8px;font-weight:700}.ok{color:var(--t)}.bad{color:var(--bad);text-shadow:none}
.hint{color:var(--m);border-left:3px solid var(--t);padding-left:10px;margin:6px 0}
html{overflow-x:hidden}main>*{min-width:0}header{flex-wrap:wrap}.card,#lv button{max-width:100%}@media(max-width:720px){h1{font-size:18px}h3{font-size:17px}#lv button{min-width:130px}.card{padding:12px}main{padding:0 10px}}
input{background:#000;border:1px solid var(--b);padding:9px 10px;min-width:90px;color:#fff}input:focus{border-color:var(--t);box-shadow:0 0 8px var(--t)}
</style></head><body>
<header><h1>[ PROMPT GUARDIAN ]</h1><div class="stat">Score <b id="sc">0</b> · Attempts <b id="ta">0</b> <button class="ghost" id="rs">Reset</button></div></header>
<main><nav id="lv"></nav><section>
<div class="card"><h3 id="tt"></h3><div class="stat" id="info"></div>
<div id="chat" aria-live="polite"></div>
<div class="row dl"><span class="pr">$</span><input id="msg" spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" placeholder="Enter command or prompt..." maxlength="600" autocomplete="off"><button class="go" id="send">Send</button></div></div>
<div class="card"><h3>[ SUBMIT PASSWORD ]</h3><div class="row" style="margin:0"><span class="pr">$</span><input id="pw" spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" placeholder="Enter the password" autocomplete="off"><button class="go" id="chk">Check</button></div><div class="fb" id="fb"></div>
<div class="row"><button class="ghost" id="hb">Hint (-10 pts)</button></div><div id="hints"></div></div>
<div id="extra"></div></section></main>
<script>
const $=s=>document.querySelector(s),N=8,NAMES=["The Open Gate","The Polite Warden","The Stern Sentinel","The Censor's Quill","The Watchful Door","The Twin Wards","The Oracle Judge","The Final Fortress"];
const fresh=()=>({sid:crypto.randomUUID(),cur:1,done:{},chat:{},att:{},hu:{},ht:{},wr:{}});
let S;try{S=JSON.parse(localStorage.pg)}catch{}S=S&&S.sid?S:fresh();
const save=()=>localStorage.pg=JSON.stringify(S),g=(o,k)=>o[k]||0;
const sc=l=>Math.max(10,100-2*Math.max(0,g(S.att,l)-1)-10*g(S.hu,l)-5*g(S.wr,l));
const api=async b=>{const r=await fetch("/api/game",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...b,sid:S.sid,level:S.cur})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error||"Network error. Please try again.")+(j.detail?" ["+j.detail+"]":""));return j};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const unlocked=l=>l===1||S.done[l-1];
function render(){
 const l=S.cur,nav=$("#lv");nav.innerHTML="";
 for(let i=1;i<=N;i++){const b=el("button",i===l?"cur":"");b.disabled=!unlocked(i);
  b.append(`[${S.done[i]?"OK":unlocked(i)?"OPEN":"LOCK"}] ${i}. ${NAMES[i-1]}`);const s=el("small","",S.done[i]?`${S.done[i]} pts`:unlocked(i)?`${g(S.att,i)} attempts`:"Locked");b.append(s);
  b.onclick=()=>{S.cur=i;save();render()};nav.append(b)}
 $("#tt").textContent=`[ ROOM ${String(l).padStart(2,"0")}: ${NAMES[l-1]} ]`;$("#info").textContent=`Attempts this level: ${g(S.att,l)} · Hints: ${g(S.hu,l)}/3`;
 const c=$("#chat");c.innerHTML="";const h=S.chat[l]||[];
 if(!h.length)c.append(el("div","m sys","SYSTEM: Connected to Guard Unit. Awaiting interface manipulation..."));
 h.forEach(m=>c.append(el("div","m "+m.r+(m.x?" x":""),m.c)));c.scrollTop=c.scrollHeight;
 const hs=$("#hints");hs.innerHTML="";(S.ht[l]||[]).forEach(t=>hs.append(el("div","hint",t)));
 $("#hb").disabled=g(S.hu,l)>=3;
 const tot=Object.values(S.done).reduce((a,b)=>a+b,0);$("#sc").textContent=tot;$("#ta").textContent=Object.values(S.att).reduce((a,b)=>a+b,0);
 const ex=$("#extra");ex.innerHTML="";
 if(S.done[l]&&S.why&&S.why[l]){const d=el("div","card why");d.append(el("h3","","[ DEBRIEF: WHY DID THIS WORK? ]"),el("div","",S.why[l]));ex.append(d)}
 if(Object.keys(S.done).length===N){const d=el("div","card why");d.append(el("h3","","[ MISSION COMPLETE ]"),el("div","",`Total score: ${tot} / 800 · Total prompts: ${$("#ta").textContent}. Rank: ${tot>650?"Archmage of Injection":tot>400?"Cunning Adept":"Apprentice"}. Remember: no single defense is foolproof, so layer them and never put real secrets in a prompt.`));ex.append(d)}
}
async function send(){
 const t=$("#msg").value.trim();if(!t)return;const l=S.cur,h=S.chat[l]=S.chat[l]||[];
 const hist=h.filter(m=>!m.x).map(m=>({role:m.r,content:m.c}));
 h.push({r:"user",c:t});S.att[l]=g(S.att,l)+1;$("#msg").value="";const bt=$("#send");bt.disabled=true;
 const wait={r:"ai",c:"…"};h.push(wait);render();
 try{const j=await api({action:"chat",message:t,history:hist});wait.c=j.reply;if(j.blocked){wait.x=1;h[h.length-2].x=1}}
 catch(e){wait.c="SYSTEM ERROR: "+e.message;wait.x=1;h[h.length-2].x=1;S.att[l]--}
 bt.disabled=false;save();render();$("#msg").focus()}
async function check(){
 const v=$("#pw").value.trim();if(!v)return;const l=S.cur,f=$("#fb");
 try{const j=await api({action:"check",guess:v});
  if(j.ok){S.done[l]=sc(l);S.why=S.why||{};S.why[l]=j.why;f.className="fb ok";f.textContent=`ACCESS GRANTED. +${S.done[l]} points.`+(l<N?" Next room unlocked.":"");$("#pw").value=""}
  else{S.wr[l]=g(S.wr,l)+1;f.className="fb bad";f.textContent="ACCESS DENIED. Wrong password."}
  save();render()}catch(e){f.className="fb bad";f.textContent="SYSTEM ERROR: "+e.message}}
async function hint(){const l=S.cur;if(!confirm("Reveal a hint? It costs 10 points."))return;try{const j=await api({action:"hint",n:g(S.hu,l)});S.hu[l]=g(S.hu,l)+1;(S.ht[l]=S.ht[l]||[]).push(j.hint);save();render()}catch(e){$("#fb").className="fb bad";$("#fb").textContent="SYSTEM ERROR: "+e.message}}
$("#send").onclick=send;$("#chk").onclick=check;$("#hb").onclick=hint;
$("#msg").addEventListener("keydown",e=>{if(e.key==="Enter")send()});$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
$("#rs").onclick=()=>{if(confirm("Reset all progress?")){S=fresh();save();$("#fb").textContent="";render()}};
render();
</script></body></html>
